name: Build and deploy reading site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build site
        run: python3 scripts/build_site.py --out _site
        env:
          # Set this under Settings > Secrets and variables > Actions.
          # Without it the private board tab is simply not built -- the
          # board is never published in plaintext.
          BOARD_PASSPHRASE: ${{ secrets.BOARD_PASSPHRASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
